<title>Combo da Vida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800;900&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0A26; --bg2:#170F3A; --panel:#1F1650; --panel2:#2A1F66; --line:#3E2F8C;
  --ink:#F4F1FF; --mute:#AFA6DB;
  --gold:#FFC940; --gold-ink:#2A1E00;
  --boss:#FF3D6E; --sky:#5EC8FF; --ok:#46E0A0;
  --grid:rgba(255,61,110,.07);
  --display:'Bungee','Arial Black',Impact,system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'VT323',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
/* "Acender as luzes" na Nova Vida (dica da lição) */
body.light{
  --bg:#FFF6DC; --bg2:#FFEDB8; --panel:#FFFFFF; --panel2:#FFF3CF; --line:#E8C66A;
  --ink:#2A1E00; --mute:#6B5A2A; --grid:rgba(255,201,64,.25);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:40px 40px;color:var(--ink);font-family:var(--body);font-weight:700;font-size:17px;
  transition:background-color 1.6s ease,color 1.6s ease}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
#app{min-height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-inline:16px;max-width:1280px;margin:0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand small{font-family:var(--mono);font-size:20px;color:var(--boss);letter-spacing:.04em}
body.light .brand small{color:#B7861A}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{font-family:var(--mono);font-size:20px;padding:4px 12px;border:2px solid var(--line);border-radius:8px;color:var(--mute)}
.tbtn:hover{color:var(--ink);border-color:var(--sky)}
.tbtn.confirm{color:#fff;background:var(--boss);border-color:var(--boss)}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:8px 20px}
.eyebrow{font-family:var(--mono);font-size:24px;letter-spacing:.08em;color:var(--sky);text-transform:uppercase;text-align:center}
h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,8vw,96px);line-height:.95;margin:0;text-align:center;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,46px);line-height:1.05;margin:0;text-align:center;text-wrap:balance}
.lead{max-width:62ch;text-align:center;color:var(--mute);font-size:clamp(16px,1.8vw,21px);line-height:1.5;margin:0}
.red{color:var(--boss)} .gold{color:var(--gold)} .sky{color:var(--sky)}
body.light .gold{color:#B7861A}
.glitch{text-shadow:3px 0 var(--boss),-3px 0 var(--sky)}
.btn{font-family:var(--display);font-size:clamp(16px,2vw,22px);padding:14px 24px;border-radius:12px;background:var(--gold);color:var(--gold-ink);box-shadow:0 5px 0 #B7861A}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #B7861A}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.small{font-size:15px;padding:9px 16px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.count{font-family:var(--mono);font-size:24px;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.85);opacity:.3}to{transform:none;opacity:1}}
  .shake{animation:shake .45s}
  @keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}
  .boss-svg{animation:hover 3s ease-in-out infinite}
  @keyframes hover{50%{transform:translateY(-10px)}}
  .boss.hit .boss-svg{animation:hit .5s}
  @keyframes hit{0%{filter:brightness(4)}30%{transform:translateX(-14px) rotate(-4deg)}60%{transform:translateX(12px) rotate(3deg)}100%{filter:none;transform:none}}
  .boss.dead .boss-svg{animation:die 1.8s forwards}
  @keyframes die{30%{transform:scale(1.15) rotate(6deg);filter:brightness(3)}100%{transform:scale(.1) rotate(-30deg);opacity:0;filter:blur(8px) brightness(4)}}
  .boss.roar .boss-svg{animation:roar .8s}
  @keyframes roar{30%{transform:scale(1.12)}60%{transform:scale(1.05) translateY(-6px)}}
  .flash{animation:flash .5s}
  @keyframes flash{0%{background:rgba(255,61,110,.45)}100%{background:transparent}}
  .beam{animation:beam .7s ease-out forwards}
  @keyframes beam{0%{transform:scaleY(0);opacity:1}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
  .dmg{animation:dmg 1.1s ease-out forwards}
  @keyframes dmg{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-10px) scale(1.2);opacity:1}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
  .ready{animation:ready 1s ease-in-out infinite}
  @keyframes ready{50%{box-shadow:0 0 0 6px rgba(255,201,64,.35),0 0 40px rgba(255,201,64,.5)}}
}

/* setup */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;width:100%;max-width:1000px}
.tcard{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px}
.av{width:56px;height:56px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:32px;border:3px solid currentColor;background:var(--bg2)}
.tcard input{width:100%;min-width:0;background:var(--bg2);border:2px solid var(--line);border-radius:8px;color:var(--ink);font:inherit;font-size:18px;padding:8px 10px}
.seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{padding:8px 16px;font-family:var(--mono);font-size:22px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--sky);color:#0E0A26}

/* boss */
.boss{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;width:100%;max-width:1000px;background:linear-gradient(90deg,#2A0E2E,var(--panel));border:3px solid var(--boss);border-radius:18px;padding:12px 18px;position:relative;overflow:visible}
.boss.big{grid-template-columns:1fr;justify-items:center;text-align:center;background:none;border:0;padding:0}
.boss-svg{width:clamp(90px,12vw,140px);height:auto;display:block}
.boss.big .boss-svg{width:clamp(200px,32vw,340px)}
.boss .info{display:flex;flex-direction:column;gap:8px;min-width:0}
.boss .nm{font-family:var(--display);font-size:clamp(18px,2.4vw,26px);color:var(--boss)}
.boss .nm small{font-family:var(--mono);font-size:20px;color:var(--mute);margin-left:8px}
.hp{height:22px;border:3px solid var(--boss);border-radius:99px;background:#1A0716;overflow:hidden;position:relative;width:100%}
.hp i{position:absolute;inset:0;background:linear-gradient(90deg,#FF3D6E,#FF8A5C);transform-origin:left;transition:transform .8s cubic-bezier(.2,.9,.3,1)}
.hp span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:20px;color:#fff;text-shadow:0 1px 0 #000}
.bubble{position:relative;background:#2A0E2E;border:3px solid var(--boss);border-radius:16px;padding:16px 20px;font-weight:900;font-size:clamp(18px,2.2vw,26px);line-height:1.35;max-width:1000px;width:100%;text-align:center;color:#FFD6E2}
.bubble b{font-family:var(--display);font-weight:400;color:var(--boss);display:block;font-size:.8em;margin-bottom:4px}
.dmg{position:absolute;left:50%;top:10px;font-family:var(--display);font-size:clamp(28px,4vw,48px);color:var(--gold);text-shadow:0 3px 0 #000;pointer-events:none;z-index:3}
.beams{position:fixed;inset:0;pointer-events:none;z-index:8;display:flex;justify-content:center;align-items:flex-end;gap:12vw}
.beam{width:26px;height:80vh;border-radius:14px;transform-origin:bottom;opacity:0}
.beam.b1{background:linear-gradient(0deg,var(--sky),#fff)} .beam.b2{background:linear-gradient(0deg,var(--gold),#fff)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:7}

/* jogo */
.meta{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:1000px;gap:10px;flex-wrap:wrap}
.turn{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:clamp(16px,2.2vw,24px)}
.turn .av{width:44px;height:44px;font-size:24px}
.pbtn{font-family:var(--mono);font-size:22px;padding:4px 14px;border:2px solid var(--sky);border-radius:8px;color:var(--sky)}
.timer{width:100%;max-width:1000px;height:12px;background:var(--bg2);border:2px solid var(--line);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--sky);transform-origin:left}
.timer i.low{background:var(--boss)}
.qcard{width:100%;max-width:1000px;background:var(--panel);border:3px solid var(--sky);border-radius:18px;padding:clamp(16px,2.6vw,28px);text-align:center;display:flex;flex-direction:column;gap:8px}
.qcard .tag{font-family:var(--mono);font-size:24px;letter-spacing:.08em;color:var(--sky);text-transform:uppercase}
.qcard .q{font-weight:900;font-size:clamp(20px,3vw,36px);line-height:1.25;text-wrap:balance}
.blank{display:inline-block;min-width:4.5em;border-bottom:4px dashed var(--gold)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:1000px}
.opt{background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;font-size:clamp(16px,1.9vw,21px);line-height:1.3;transition:border-color .12s,transform .12s,opacity .2s}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateY(-3px)}
.opt .k{font-family:var(--display);font-size:18px;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--gold);color:var(--gold-ink)}
.opt.right{border-color:var(--ok);background:#12393F;color:#fff}
.opt.right .k{background:var(--ok)}
.opt.wrong{border-color:var(--boss);background:#46163F;color:#fff}
.opt.dim{opacity:.35}
.opt:disabled{cursor:default}
.fb{width:100%;max-width:1000px;border-radius:16px;padding:16px 20px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.fb.ok{background:#12393F;border:3px solid var(--ok);color:#fff}
.fb.bad{background:#3A1238;border:3px solid var(--boss);color:#fff}
.fb.info{background:var(--panel);border:3px solid var(--gold)}
.fb h3{font-family:var(--display);font-weight:400;font-size:clamp(20px,2.8vw,30px);margin:0}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--boss)}
.fb p{margin:0;max-width:65ch;line-height:1.45;font-size:18px}

/* combo */
.combo{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%;max-width:760px}
.cb{border-radius:20px;padding:22px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:4px solid;user-select:none;-webkit-user-select:none;touch-action:none;transition:transform .08s,filter .15s}
.cb svg{width:clamp(48px,7vw,76px);height:auto}
.cb b{font-family:var(--display);font-weight:400;font-size:clamp(22px,3vw,34px)}
.cb small{font-size:clamp(14px,1.6vw,18px);font-weight:800;opacity:.9}
.cb .key{font-family:var(--mono);font-size:20px;opacity:.7}
.cb.mouth{background:#15324F;border-color:var(--sky);color:#fff} .cb.mouth b{color:var(--sky)}
.cb.heart{background:#3A1238;border-color:var(--boss);color:#fff} .cb.heart b{color:#FF8FB0}
.cb.down{transform:scale(.94);filter:brightness(1.5)}
.combo-msg{font-family:var(--mono);font-size:24px;color:var(--mute);min-height:1.3em;text-align:center}
.combo-msg.err{color:var(--boss)}

/* rodada */
.round-no{font-family:var(--display);font-size:clamp(70px,14vw,170px);line-height:.9;color:var(--boss);text-shadow:0 0 40px rgba(255,61,110,.5)}
.task{font-family:var(--display);font-size:clamp(24px,3.6vw,42px);line-height:1.15;text-align:center;max-width:26ch;text-wrap:balance}

/* placar */
.board{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:10px;padding-block:12px 16px;border-top:2px solid var(--line)}
.team{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:2px solid transparent;min-width:0}
.team.active{border-color:currentColor;background:var(--bg2)}
.team .av{width:42px;height:42px;font-size:24px;border-width:2px}
.team .info{min-width:0}
.team .n{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.team .s{font-family:var(--mono);font-size:28px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
body.light .team .s{color:#B7861A}
.rank{display:flex;flex-direction:column;gap:12px;width:100%;max-width:760px}
.rk{display:grid;grid-template-columns:52px auto 1fr auto;align-items:center;gap:14px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 18px}
.rk.first{border-color:var(--gold)}
.rk .pos{font-family:var(--display);font-size:28px;color:var(--mute)}
.rk .nm{font-family:var(--display);font-size:22px;min-width:0}
.rk .nm small{display:block;font-family:var(--mono);font-size:20px;color:#B7861A}
.rk .sc{font-family:var(--mono);font-size:34px;color:#B7861A}

/* nova vida */
.newlife{font-family:var(--display);font-size:clamp(46px,9vw,120px);line-height:.95;color:#B7861A;text-align:center;text-shadow:0 0 50px rgba(255,201,64,.7)}
.prayer{font-family:var(--display);font-size:clamp(20px,3vw,36px);line-height:1.3;text-align:center;max-width:30ch;text-wrap:balance}
.shout{background:var(--gold);color:var(--gold-ink);border-radius:18px;padding:18px 24px;text-align:center;font-family:var(--display);font-size:clamp(20px,3vw,34px);line-height:1.2;max-width:900px}
.shout small{display:block;font-family:var(--body);font-weight:900;font-size:.6em;margin-bottom:6px}

.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(10,6,30,.88);padding:16px}
.overlay .box{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;color:#F4F1FF}
.overlay .big-t{font-family:var(--display);font-size:clamp(40px,8vw,90px);line-height:1}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-family:var(--display);font-size:clamp(17px,2.4vw,26px);padding:14px 24px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:30;text-align:center;max-width:calc(100% - 32px)}

@media (max-width:760px){
  .opts{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
  .rk{grid-template-columns:40px auto 1fr auto;padding:10px 12px}
}
@media (max-width:600px){
  #app{padding-inline:12px}
  .brand{font-size:15px} .brand small{display:none}
  .tbtn{font-size:18px;padding:3px 9px}
  main{gap:12px}
  .btn{padding:12px 18px}
  .boss{grid-template-columns:auto 1fr;gap:10px;padding:8px 10px}
  .boss-svg{width:70px}
  .hp{height:18px} .hp span{font-size:16px}
  .opt{padding:10px 12px;font-size:16px}
  .opt .k{width:30px;height:30px;font-size:15px}
  .combo{gap:10px}
  .cb{padding:16px 8px}
  .team{padding:6px} .team .av{width:34px;height:34px;font-size:19px}
  .eyebrow{font-size:20px}
}

/* ---- configuração no celular ---- */
@media (max-width:600px){
  .row:has(>.seg){flex-direction:column;align-items:stretch;width:100%;gap:6px}
  .row:has(>.seg) .count{text-align:left;font-size:18px}
  .seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));width:100%}
  .seg button{white-space:normal;line-height:1.15;padding:9px 6px;font-size:19px}
  .teams{grid-template-columns:1fr 1fr;gap:8px}
  .tcard{flex-direction:column;padding:10px;gap:8px}
  .tcard .av{width:44px;height:44px;font-size:24px}
  .tcard input{font-size:16px;padding:7px 8px;text-align:center}
  h1{font-size:44px}
}
</style>

<div id="app"></div>
<div id="flash"></div>
<div id="toast" class="toast" hidden></div>
<div id="overlay" class="overlay" hidden>
  <div class="box">
    <div id="ov-title" class="big-t"></div>
    <p id="ov-text" class="lead" style="color:#AFA6DB"></p>
    <button class="btn" id="ov-go" data-act="resume">Continuar</button>
  </div>
</div>

<script>
/* ---------- Conteúdo do Encontro 4 (Romanos 10:9) ---------- */
const VERSE='“Se você confessar com a sua boca que Jesus é Senhor e crer em seu coração que Deus o ressuscitou dentre os mortos, será salvo.”';
// Rodada 1 · Conhecimento bíblico — a primeira opção é sempre a certa (embaralhada na hora)
const R1=[
  ['Complete o versículo: “Se você <span class="blank"></span> com a sua boca que Jesus é Senhor…”',['confessar','gritar','esconder','cantar baixinho']],
  ['Complete: “…e crer em seu <span class="blank"></span> que Deus o ressuscitou dentre os mortos, será salvo.”',['coração','caderno','celular','sonho']],
  ['Quem venceu a morte segundo Romanos 10:9?',['Jesus: Deus o ressuscitou dentre os mortos','O Boss','Os jogadores mais fortes','Ninguém venceu a morte']],
  ['O que significa “confessar com a boca”?',['Dizer com a sua boca que Jesus é o verdadeiro chefe da sua vida','Só pedir desculpas quando erra','Falar baixinho para ninguém ouvir','Contar os erros dos outros']],
  ['O que é “crer”?',['Ter certeza total, como se você tivesse presenciado','Achar que talvez seja verdade','Decorar o versículo','Ser bonzinho o tempo todo']],
  ['No jogo da vida, quais são os dois nomes do Final Boss?',['Pecado e Morte','Medo e Tristeza','Hacker e Vírus','Raiva e Inveja']],
  ['Depois de quantos dias Jesus ressuscitou?',['3 dias','7 dias','1 dia','40 dias']],
  ['Em qual carta Paulo deixou o código de vitória contra o Final Boss?',['Romanos','Efésios','Colossenses','Filipenses']],
  ['Dá para vencer o Boss sozinho, se esforçando e sendo bonzinho o tempo todo?',['Não! Sozinhos é impossível, precisamos de Jesus','Sim, é só se esforçar bastante','Sim, se for o mais forte','Sim, se nunca errar']]
];
// Rodada 2 · Ataques do Boss (texto da lição)
const R2=[
  ['Mentira','O Boss lança a magia da Mentira! Ele fala baixinho em sua mente: “Ninguém gosta de você, então invente histórias para parecer melhor!”',
   ['Falar mentira é pecado. Eu confio que Jesus é a Verdade!','Inventar uma história ainda maior','Ficar quieto e acreditar no Boss','Mentir só um pouquinho']],
  ['Medo','O Boss solta o feitiço do Medo! Ele grita: “Você nunca vai conseguir, é melhor desistir!”',
   ['O amor lança fora todo medo! Em Jesus recebo coragem e sou vitorioso','Desistir de tudo','Se esconder para sempre','Concordar: eu nunca vou conseguir']],
  ['Raiva','O Boss dispara o golpe da Raiva! Ele provoca: “Sinta ódio, grite e brigue com sua família e seus amigos!”',
   ['Peço perdão pelos sentimentos ruins e peço que Jesus me dê paz e domínio próprio','Gritar mais alto que todo mundo','Brigar só com quem merece','Guardar a raiva para depois']],
  ['Desobediência','O Boss usa o ataque da Desobediência! Ele ordena: “Não ouça seus pais, eles não sabem de nada, faça só o que você quiser!”',
   ['Reconheço que fui desobediente, peço perdão e confio no ensino de Jesus de obedecer com amor','Fazer só o que eu quiser','Obedecer só quando estão olhando','Fingir que não ouvi']],
  ['Engano Final','O Boss lança o golpe supremo: “Você nunca vai conseguir, você é um zero à esquerda, nem mesmo Jesus pode te salvar!”',
   ['Confesso meus pecados, peço perdão a Jesus e confio que Ele já venceu a morte e ressuscitou!','Acreditar que sou um zero à esquerda','Tentar vencer sozinho','Desligar o jogo e desistir']]
];
// Rodada 3 · Missões rápidas (o Game Master julga)
const R3=[
  ['Diga em voz alta, todo o time junto:','“Jesus é meu Senhor!”','O time falou bem forte, com a boca? Então o Botão 1 foi ativado!'],
  ['Explique em uma frase:','O que significa “crer no coração”?','Crer é ter certeza total de que Jesus morreu e ressuscitou, como se você tivesse presenciado.'],

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

let AC;function beep(f,d=.12,type='square',when=0,vol=.07,to){if(S.muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const SFX={
  roar(){beep(140,.9,'sawtooth',0,.09,50);beep(90,1,'square',.05,.05,40)},
  hit(){beep(200,.15,'square',0,.08,80);beep(900,.2,'triangle',.05,.07,300)},
  ok(){[523,659,784,1047].forEach((f,i)=>beep(f,.14,'square',i*.08))},
  bad(){beep(180,.35,'sawtooth');beep(120,.45,'sawtooth',.15)},
  combo(){beep(523,.5,'triangle',0,.08);beep(784,.5,'triangle',0,.08);beep(1047,.6,'triangle',.15,.08)},
  press(){beep(660,.06,'square',0,.05)},
  win(){[392,523,659,784,1047,1319,1568].forEach((f,i)=>beep(f,.25,'triangle',i*.12,.1))},
  tick(){beep(1250,.03,'square',0,.03)},click(){beep(720,.05,'square',0,.04)}
};
let toastT;function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}

/* ---------- Timer com pausa ---------- */
let timerI=null,T=null;
function stopTimer(){clearInterval(timerI);timerI=null;T=null;$('#overlay').hidden=true}
function startTimer(sec,onEnd){clearInterval(timerI);T={total:sec,left:sec,onEnd,paused:false,up:false,last:sec};let prev=Date.now();
  timerI=setInterval(()=>{const now=Date.now();if(!T||T.paused||T.up){prev=now;return}T.left=Math.max(0,T.left-(now-prev)/1000);prev=now;
    const bar=$('.timer i');if(bar){bar.style.transform=`scaleX(${T.left/T.total})`;bar.classList.toggle('low',T.left<6)}
    const s=Math.ceil(T.left);if(s<T.last){T.last=s;if(s<=5&&s>0)SFX.tick()}
    if(T.left<=0){T.up=true;SFX.bad();showOverlay('time')}},100)}
function togglePause(){if(!T||T.up)return;T.paused=!T.paused;SFX.click();T.paused?showOverlay('pause'):($('#overlay').hidden=true)}
function showOverlay(k){$('#ov-title').textContent=k==='time'?'Tempo esgotado!':'Jogo pausado';$('#ov-title').style.color=k==='time'?'#FF3D6E':'#5EC8FF';
  $('#ov-text').textContent=k==='time'?'O relógio parou. Clique em Continuar para ver a resposta.':'Clique em Continuar (ou aperte espaço) para voltar.';$('#overlay').hidden=false;$('#ov-go').focus()}
function resume(){if(!T){$('#overlay').hidden=true;return}if(T.up){const f=T.onEnd;stopTimer();f();return}if(T.paused)togglePause()}

      </div>
    </header>
    <main>${inner}</main>
    <footer class="board" id="board" ${board?'':'hidden'}></footer>`;
  renderBoard();
}
function renderBoard(){const b=$('#board');if(!b)return;b.style.setProperty('--n',S.n);const act=S.screen==='play'?S.turn:-1;
  b.innerHTML=teams().map((t,i)=>`<div class="team ${i===act?'active':''}" style="color:${COLORS[i]}">${avHTML(i,t)}<div class="info"><div class="n">${esc(t.name)}</div><div class="s">${t.score}</div></div></div>`).join('')}
function bossHTML(big){return `<div class="boss ${big?'big':''}" id="boss">${BOSS_SVG}<div class="info" style="${big?'width:min(700px,100%)':''}"><div class="nm">FINAL BOSS<small>Pecado & Morte</small></div><div class="hp"><i style="transform:scaleX(${S.boss/100})"></i><span>HP ${S.boss}</span></div></div></div>`}
function updBoss(){const i=$('.hp i'),sp=$('.hp span');if(i)i.style.transform=`scaleX(${S.boss/100})`;if(sp)sp.textContent=`HP ${S.boss}`}
function damage(n){
  const before=S.boss;S.boss=Math.max(FLOOR,S.boss-n);const real=before-S.boss;
  const b=$('#boss');if(b){b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');
    const d=document.createElement('div');d.className='dmg';d.textContent=real>0?`−${real}`:'IMUNE!';b.appendChild(d);setTimeout(()=>d.remove(),1100)}
  SFX.hit();setTimeout(updBoss,120);
  if(S.boss===FLOOR&&!S.floorHit){S.floorHit=true;setTimeout(()=>toast('O Boss não cai! Sozinhos não conseguimos vencer…'),900)}
}
function addPts(i,n){S.teams[i].score+=n;renderBoard()}
function render(){stopTimer();document.body.classList.toggle('light',['victory','end'].includes(S.screen));

const ROUNDS={1:['Conhecimento bíblico','Acertem as perguntas de Romanos 10:9 para atacar o Boss.',R1.length],

function startRound(){
  S.qi=0;S.turn=0;
  if(S.round===1) S.order=shuffle(R1.map((_,i)=>i));
  else if(S.round===2) S.order=R2.map((_,i)=>i);
  else if(S.round===3) S.order=R3.map((_,i)=>i);
  else S.order=teams().map((_,i)=>i); // rodada final: uma frase por time
  newQ();S.screen='play';render();
}
function newQ(){
  const k=S.order[S.qi];
  if(S.round===1){const opts=shuffle(R1[k][1].map((t,i)=>({t,ok:i===0})));S.q={type:'mc',opts,pick:null}}
  else if(S.round===2){const opts=shuffle(R2[k][2].map((t,i)=>({t,ok:i===0})));S.q={type:'attack',opts,pick:null,stage:'answer'}}
  else if(S.round===3){S.q={type:'judge',show:false,done:null}}
  else {S.turn=k;S.q={type:'phrase',done:null}}
}
function total(){return S.order.length}

function renderPlay(){
  const q=S.q,t=cur(),k=S.order[S.qi];let head='',body='';
  const answered=(q.type==='mc'||q.type==='attack')?q.pick!==null:q.done!==null;
  const showTimer=(q.type==='mc'||q.type==='attack')&&q.pick===null;
  if(q.type==='mc'){
    head=`<div class="qcard"><div class="tag">Rodada 1 · Conhecimento bíblico</div><div class="q">${R1[k][0]}</div></div>`;
    body=optsHTML(q);
  } else if(q.type==='attack'){
    const a=R2[k];
    head=`<div class="bubble ${q.pick===null?'pop':''}"><b>Ataque ${S.qi+1}: ${esc(a[0])}</b>${esc(a[1])}</div>`;
    if(q.stage==='answer') body=`${q.pick===null?'<p class="lead" style="font-size:17px">Qual resposta ativa o Combo contra esse ataque?</p>':''}${optsHTML(q)}`;
    if(q.stage==='combo') body=`${optsHTML(q)}${comboHTML('Resposta certa! Agora ative o COMBO: aperte BOCA + CORAÇÃO ao mesmo tempo!')}`;
  } else if(q.type==='judge'){
    const m=R3[k];
    head=`<div class="qcard"><div class="tag">Rodada 3 · Missão ${S.qi+1}</div><div class="lead" style="font-size:20px">${esc(m[0])}</div><div class="task" style="margin:auto">${esc(m[1])}</div></div>`;
    body=q.done===null?`${q.show?`<div class="fb info pop"><p><b>Resposta sugerida:</b> ${esc(m[2])}</p></div>`:''}
      <div class="row">${q.show?'':'<button class="btn ghost small" data-act="reveal">Ver resposta sugerida</button>'}
      <button class="btn" data-act="judgeYes">✓ Cumpriu a missão</button><button class="btn ghost" data-act="judgeNo">✗ Não cumpriu</button></div>`:'';
  } else {
    head=`<div class="qcard"><div class="tag">Rodada final · Frase do Combo</div><div class="task" style="margin:auto">Criem uma frase com as palavras <span class="gold">CONFESSAR</span>, <span class="gold">CONFIAR</span> e <span class="gold">VITÓRIA</span>!</div></div>`;
    body=q.done===null?`<div class="row"><button class="btn" data-act="judgeYes">✓ Frase criada!</button><button class="btn ghost" data-act="judgeNo">✗ Não conseguiram</button></div>`:'';
  }
  let fb='';
  if(answered&&!(q.type==='attack'&&q.stage==='combo')){
    const good=q.type==='mc'||q.type==='attack'?q.opts[q.pick]?.ok:q.done;
    const last=S.qi+1>=total();
    let title,msg='';
    if(q.type==='attack'){title=good?'COMBO ativado! Ataque bloqueado!':q.timeout?'Tempo esgotado! O Boss acertou.':'O Boss acertou! Sozinho não dá.';msg=good?'':`<p>Resposta certa: <b>${esc(R2[k][2][0])}</b></p>`}
    else if(q.type==='mc'){title=good?'Acertou! Golpe no Boss!':q.timeout?'Tempo esgotado!':'Errou! O Boss se defendeu.';msg=good?'':`<p>Resposta certa: <b>${esc(R1[k][1][0])}</b></p>`}
    else {title=good?'Missão cumprida! Golpe no Boss!':'Missão não cumprida.'}
    fb=`<div class="fb ${good?'ok':'bad'} pop"><h3>${title}</h3>${good?`<p class="count" style="color:var(--gold)">+${q.pts} XP</p>`:''}${msg}
      <button class="btn" data-act="next">${last?(S.round<4?'Fim da rodada →':'Enfrentar o golpe final →'):'Próximo →'}</button></div>`;
  }
  frame(`
    ${bossHTML(false)}
    <div class="meta">
      <div class="turn">${avHTML(S.turn,t)}<span>Vez do ${esc(t.name)}</span></div>
      ${showTimer?'<button class="pbtn" data-act="pause">⏸ Pausar</button>':''}
      <div class="count">${S.round<4?'RODADA '+S.round:'FINAL'} · ${S.qi+1}/${total()}</div>
    </div>
    ${showTimer?'<div class="timer"><i></i></div>':''}
    ${head}${body}${fb}
  `);
  if(showTimer) startTimer(S.secs,()=>answer(null,true));
  if(q.type==='attack'&&q.stage==='combo') armCombo(()=>{comboFire(()=>{q.stage='done';q.pts=15;addPts(S.turn,15);renderPlay();damage(DMG[2])})});
}
function optsHTML(q){
  const k=S.q.pick!==null;
  return `<div class="opts">${q.opts.map((o,i)=>{let c='';if(k){if(o.ok)c='right';else if(i===q.pick)c='wrong';else c='dim'}
    return `<button class="opt ${c}" data-ans="${i}" ${k?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${esc(o.t)}</span></button>`}).join('')}</div>`;
}
function answer(i,timeout){
  const q=S.q;if(q.pick!==null)return;stopTimer();
  q.pick=timeout?-1:i;q.timeout=!!timeout;
  const good=!timeout&&q.opts[i].ok;
  if(q.type==='attack'){
    if(good){SFX.ok();q.stage='combo';renderPlay();return}
    SFX.roar();flash();const b=document.body;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');q.stage='done';renderPlay();return;
  }
  if(good){SFX.ok();q.pts=10;addPts(S.turn,10);renderPlay();damage(DMG[1])}else{SFX.bad();renderPlay()}
}
function judge(yes){
  const q=S.q;if(q.done!==null)return;q.done=yes;
  if(yes){SFX.ok();q.pts=S.round===3?10:15;addPts(S.turn,q.pts);renderPlay();damage(DMG[S.round])}else{SFX.bad();renderPlay()}
}
function next(){
  S.qi++;
  if(S.qi>=total()){
    if(S.round<4){S.round++;S.screen='round';render();return}
    S.screen='final';S.fstage='boss';render();return;
  }
  if(S.round<4) S.turn=(S.turn+1)%S.n;
  newQ();renderPlay();
}

  </div>
  <div class="combo-msg" id="cmsg">Os dois juntos! Só um não avança.</div>`;
}
let CB=null;
function armCombo(onDone){CB={mouth:0,heart:0,onDone,done:false,warnT:null}}
function pressCombo(which){
  if(!CB||CB.done)return;
  const now=Date.now();CB[which]=now;SFX.press();
  const el=$(`[data-cb="${which}"]`);if(el){el.classList.add('down');setTimeout(()=>el.classList.remove('down'),160)}
  const other=which==='mouth'?'heart':'mouth';
  if(now-CB[other]<650){CB.done=true;clearTimeout(CB.warnT);const f=CB.onDone;CB=null;f();return}
  clearTimeout(CB.warnT);
  CB.warnT=setTimeout(()=>{const m=$('#cmsg');if(m){m.textContent=`Só ${which==='mouth'?'a BOCA':'o CORAÇÃO'} não avança! Apertem os DOIS juntos.`;m.classList.add('err')}},700);
}
function comboFire(then){
  SFX.combo();
  const bw=document.createElement('div');bw.className='beams';bw.innerHTML='<i class="beam b1"></i><i class="beam b2"></i>';document.body.appendChild(bw);
  setTimeout(()=>{bw.remove();then()},700);
}

function victory(){
  frame(`
    <div class="eyebrow" style="color:#B7861A">Final Boss derrotado · Jesus venceu!</div>
    <div class="newlife pop">NOVA VIDA</div>
    <p class="lead" style="max-width:56ch">O Boss já foi derrotado por Jesus na cruz e quando Ele ressuscitou. A batalha já foi ganha! Deus não espera que você seja perfeito: Ele quer que você diga que Jesus é o Senhor e acredite que Ele está vivo.</p>
    <p class="prayer">“Jesus, eu confesso que o Senhor é o dono do meu jogo. Eu creio que o Senhor morreu por mim e ressuscitou ao terceiro dia. Escreva meu nome no livro da vida, quero que meu sistema seja governado pelo Senhor. Tomo posse da minha NOVA VIDA.”</p>
    <div class="shout"><small>O Game Master pergunta: “Quem tem nova vida?”</small>“Eu tenho, porque Jesus é o meu Senhor!”</div>
    <button class="btn" data-act="end">Ver placar final</button>
  `);
}
function end(){
  const r=teams().map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score);
  frame(`
    <div class="eyebrow" style="color:#B7861A">Especial Bíblico de Férias · Level UP completo</div>
    <h2>Todos são vencedores no jogo da vida!</h2>
    <div class="rank">${r.map((t,k)=>`<div class="rk ${k===0?'first':''} pop"><span class="pos">${k+1}º</span>${avHTML(t.i,t)}<span class="nm">${esc(t.name)}<small>NOVA VIDA${k===0?' · MAIS XP':''}</small></span><span class="sc">${t.score}</span></div>`).join('')}</div>
    <div class="row"><button class="btn ghost" data-act="again">Jogar de novo</button></div>
  `);
}
function resetGame(){S.teams.forEach(t=>t.score=0);S.boss=100;S.round=1;S.qi=0;S.turn=0;S.q=null;S.floorHit=false;S.fstage=null}

/* ---------- Eventos ---------- */
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-cb]');if(b){e.preventDefault();pressCombo(b.dataset.cb)}});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.dataset.cb)return;const d=b.dataset;
  if(d.n){S.n=+d.n;SFX.click();render();return}
  if(d.secs){S.secs=+d.secs;SFX.click();render();return}
  if(d.av){const t=S.teams[+d.av];t.av=(t.av+1)%AVATARS.length;b.textContent=AVATARS[t.av];SFX.click();return}
  if(d.ans!==undefined){answer(+d.ans);return}
  switch(d.act){
    case 'mute':S.muted=!S.muted;b.textContent=S.muted?'Som: off':'Som: on';break;
    case 'begin':resetGame();S.screen='intro';render();break;
    case 'toRound':S.screen='round';render();break;
    case 'startRound':startRound();break;
    case 'skipRound':S.round++;render();break;
    case 'pause':togglePause();break;
    case 'resume':resume();break;
    case 'reveal':S.q.show=true;renderPlay();break;
    case 'judgeYes':judge(true);break;
    case 'judgeNo':judge(false);break;
    case 'next':next();break;
    case 'regen':b.disabled=true;regen();break;
    case 'end':S.screen='end';render();break;
    case 'again':resetGame();S.screen='intro';render();break;
    case 'restart':
      if(!b.classList.contains('confirm')){b.classList.add('confirm');b.textContent='Recomeçar? Clique de novo';
        const froze=T&&!T.paused&&!T.up;if(froze)T.paused=true;
        clearTimeout(b._t);b._t=setTimeout(()=>{b.classList.remove('confirm');b.textContent='↺ Reiniciar';if(froze&&T)T.paused=false},3500);return}
      resetGame();CB=null;S.screen='setup';render();toast('Jogo reiniciado');break;
  }
});
document.addEventListener('input',e=>{const i=e.target.dataset.name;if(i!==undefined)S.teams[+i].name=e.target.value.trim()||`Time ${+i+1}`});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();
  if(!$('#overlay').hidden){if(k===' '||k==='enter'){e.preventDefault();resume()}return}
  if(CB&&(k==='b'||k==='c')){pressCombo(k==='b'?'mouth':'heart');return}
  if(S.screen==='play'&&S.q&&(S.q.type==='mc'||S.q.type==='attack')&&S.q.pick===null){
    if(k===' '){e.preventDefault();togglePause();return}
    const i='abcd'.indexOf(k);if(i>=0&&i<S.q.opts.length){answer(i);return}
  }
  if(k==='enter'&&!e.target.closest('button')){const nx=document.querySelector('[data-act="next"],[data-act="startRound"],[data-act="toRound"]');if(nx)nx.click()}
});

/* ---------- Boot ---------- */
function start(data){if(data&&data.S){S=data.S;if(S.screen==='final'&&S.fstage==='boss'&&S.boss>FLOOR)S.fstage='combo'}render()}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
